name: Paperize CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew clean test

      # The build exports the database schema to app/schemas. Any difference means an entity
      # changed without a new database version and migration, or a new schema wasn't committed.
      - name: Check the database schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --porcelain -- app/schemas
            echo "::error::Room schemas changed. Add a database version with a migration, and commit app/schemas."
            exit 1
          fi

      - name: Run Android lint
        run: ./gradlew :app:lintDebug

  # Secrets can't be read in a job-level `if`, so this job reports whether signing is set up.
  # Forks without the signing secrets still run tests and lint; the signed build and release skip.
  signing:
    name: Check Signing Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for signing secrets
        id: check
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEY_ALIAS" ] \
            && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not all set; skipping the signed build and release."
          fi

  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    needs: [test, signing]
    if: needs.signing.outputs.available == 'true'
    steps:
      - name: Checkout repository source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Base64 Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo $SIGNING_KEYSTORE_BASE64 | base64 --decode > ${{ github.workspace }}/keystore.jks

      - name: Build Release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Get Version Name
        id: get_version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION_NAME=${GITHUB_REF_NAME}
          else
            RAW_VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
            VERSION_NAME="v${RAW_VERSION}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Name APK for distribution
        shell: bash
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/paperized-${{ steps.get_version.outputs.VERSION_NAME }}.apk"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paperized-${{ steps.get_version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/paperized-${{ steps.get_version.outputs.VERSION_NAME }}.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: paperized-v*
          path: ./apk-artifact
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ./apk-artifact/paperized-v*.apk
          draft: true
          generate_release_notes: true

